name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Set version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - name: Validate release version
        run: |
          PACKAGE_VERSION=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "haru") | .version')
          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Release version $VERSION does not match Cargo.toml version $PACKAGE_VERSION" >&2
            exit 1
          fi
      - name: Check and test
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Build
        run: |
          cargo build --locked --release --target x86_64-unknown-linux-gnu
          strip target/x86_64-unknown-linux-gnu/release/haru
          cp target/x86_64-unknown-linux-gnu/release/haru "haru-${VERSION}-linux-x86_64"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: haru-linux-x86_64
          path: haru-${{ env.VERSION }}-linux-x86_64
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Set version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Validate release version
        run: |
          PACKAGE_VERSION=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "haru") | .version')
          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Release version $VERSION does not match Cargo.toml version $PACKAGE_VERSION" >&2
            exit 1
          fi
      - name: Build universal binary
        run: |
          cargo build --locked --release --target aarch64-apple-darwin
          cargo build --locked --release --target x86_64-apple-darwin
          lipo -create target/aarch64-apple-darwin/release/haru \
            target/x86_64-apple-darwin/release/haru -output "haru-${VERSION}-macos-universal"
      - name: Sign and notarize
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: |
          set -euo pipefail
          : "${APPLE_ID:?Missing APPLE_ID}"
          : "${APPLE_TEAM_ID:?Missing APPLE_TEAM_ID}"
          : "${APPLE_PASSWORD:?Missing APPLE_PASSWORD}"
          : "${APPLE_SIGNING_IDENTITY:?Missing APPLE_SIGNING_IDENTITY}"
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" \
            --options runtime --timestamp "haru-${VERSION}-macos-universal"
          codesign --verify --strict --verbose=2 "haru-${VERSION}-macos-universal"
          ditto -c -k --keepParent "haru-${VERSION}-macos-universal" haru.zip
          xcrun notarytool submit haru.zip --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" --password "$APPLE_PASSWORD" \
            --wait --output-format json > "$RUNNER_TEMP/notarization.json"
          python3 - "$RUNNER_TEMP/notarization.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1]) as result:
              report = json.load(result)
          if report.get("status") != "Accepted":
              raise SystemExit(f"Notarization failed: {report}")
          PY
          # Bare binaries cannot be stapled; Gatekeeper retrieves the ticket online.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: haru-macos-universal
          path: haru-${{ env.VERSION }}-macos-universal
          if-no-files-found: error

  release:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        working-directory: dist
        run: |
          VERSION="${TAG#v}"
          sha256sum "haru-${VERSION}-linux-x86_64" "haru-${VERSION}-macos-universal" > SHA256SUMS
          gh release create "$TAG" haru-"$VERSION"-* SHA256SUMS \
            --verify-tag --title "$TAG" --generate-notes
